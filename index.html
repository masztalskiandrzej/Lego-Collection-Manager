<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Collection Manager</title>
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <!-- User Button (Top Right) -->
    <button class="btn btn-user" id="userBtn">
        <span class="user-icon">👤</span>
        <span class="user-name" id="userName">Loading...</span>
    </button>

    <div class="panels-container panels-2">
        <a href="sets.html" class="panel panel-sets">
            <div class="panel-overlay"></div>
            <div class="panel-content">
                <div class="panel-icon">🧱</div>
                <h2 class="panel-title">Sets</h2>
                <p class="panel-description">Manage your LEGO sets collection</p>
            </div>
        </a>

        <a href="minifigs.html" class="panel panel-minifigs">
            <div class="panel-overlay"></div>
            <div class="panel-content">
                <div class="panel-icon">👤</div>
                <h2 class="panel-title">Minifigures</h2>
                <p class="panel-description">Manage your LEGO minifigures collection</p>
            </div>
        </a>
    </div>

    <!-- Scripts -->
    <!-- Firebase Compat SDK (loaded from CDN - works with file:// protocol) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Shared Modules (Regular Scripts - no ES6 modules) -->
    <script src="js/shared/firebase-config.js"></script>
    <script src="js/shared/auth.js"></script>

    <!-- Initialize Auth and check login state -->
    <script>
        // Initialize Auth module
        if (window.Auth) {
            window.Auth.init();
            console.log('🔐 Auth module initialized');

            // Check auth state and redirect to login if not authenticated
            window.Auth.waitForAuthState().then(isLoggedIn => {
                if (!isLoggedIn || !window.Auth.isAuthenticated()) {
                    console.log('🔒 Not logged in, redirecting to login page...');
                    window.location.href = 'login.html';
                } else {
                    console.log('✅ User is logged in, showing home page');
                    // Update user button with username
                    const email = window.Auth.getUserEmail();
                    const username = email ? email.split('@')[0] : 'User';
                    document.getElementById('userName').textContent = username;
                }
            });
        } else {
            console.error('❌ Auth module not loaded');
            // If Auth not available, redirect to login
            window.location.href = 'login.html';
        }

        // User button click - logout
        document.getElementById('userBtn').addEventListener('click', async () => {
            if (confirm('Czy chcesz się wylogować?')) {
                try {
                    await window.Auth.logout();
                    window.location.href = 'login.html';
                } catch (error) {
                    console.error('Logout error:', error);
                    alert('Błąd wylogowania: ' + error.message);
                }
            }
        });
    </script>
</body>
</html>
