<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Collection Manager</title>
    <link rel="stylesheet" href="css/home.css?v=2">
</head>
<body>
    <!-- Language switch -->
    <div class="lang-switch is-floating" role="group" aria-label="Language">
        <button type="button" data-lang-btn="pl" class="lang-btn active">PL</button>
        <button type="button" data-lang-btn="en" class="lang-btn">EN</button>
    </div>

    <!-- User Button (Top Right) -->
    <button class="btn btn-user" id="userBtn">
        <span class="user-icon">👤</span>
        <span class="user-name" id="userName">Ładowanie...</span>
    </button>

    <div class="panels-container panels-2">
        <a href="sets.html" class="panel panel-sets">
            <div class="panel-overlay"></div>
            <div class="panel-content">
                <img src="images/lego-icon.png" class="panel-icon img" alt="">
                <h2 class="panel-title" data-i18n="index.sets">Zestawy</h2>
                <p class="panel-description" data-i18n="index.setsDesc">Zarządzaj kolekcją zestawów LEGO</p>
            </div>
        </a>

        <a href="minifigs.html" class="panel panel-minifigs">
            <div class="panel-overlay"></div>
            <div class="panel-content">
                <img src="images/minifig-icon.png" class="panel-icon img" alt="">
                <h2 class="panel-title" data-i18n="index.minifigs">Minifigurki</h2>
                <p class="panel-description" data-i18n="index.minifigsDesc">Zarządzaj kolekcją minifigurek LEGO</p>
            </div>
        </a>

        <!-- Teaser dashboardu (na dolnej krawędzi paneli) -->
        <button type="button" id="dashTeaser" class="dash-teaser">
            <span data-i18n="dash.teaser">📊 Statystyki kolekcji</span>
            <span class="dash-teaser-arrow">&#9662;</span>
        </button>
    </div>

    <!-- Dashboard (statystyki kolekcji) -->
    <section id="dashboardSection" class="dash-container" style="display: none;"></section>

    <!-- Scripts -->
    <!-- Firebase Compat SDK (loaded from CDN - works with file:// protocol) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>

    <!-- Shared Modules (Regular Scripts - no ES6 modules) -->
    <script src="js/shared/firebase-config.js"></script>
    <script src="js/shared/i18n.js"></script>
    <script src="js/shared/dialogs.js"></script>
    <script src="js/shared/firestore-storage.js"></script>
    <script src="js/shared/dashboard.js"></script>
    <script src="js/shared/auth.js"></script>

    <!-- Initialize modules and check login state -->
    <script>
        // Initialize Auth module
        if (window.Auth) {
            window.Auth.init();

            // Lokalizowany tekst ładowania
            const userNameEl = document.getElementById('userName');
            if (userNameEl && window.I18N) userNameEl.textContent = window.I18N.t('common.loading');

            // Check auth state and redirect to login if not authenticated
            window.Auth.waitForAuthState().then(isLoggedIn => {
                if (!isLoggedIn || !window.Auth.isAuthenticated()) {
                    window.location.href = 'login.html';
                } else {
                    // Update user button with username
                    const email = window.Auth.getUserEmail();
                    const username = email ? email.split('@')[0] : (window.I18N ? window.I18N.t('common.user') : 'User');
                    if (userNameEl) userNameEl.textContent = username;

                    // Dashboard statystyk (re-render przy zmianie języka)
                    if (window.Dashboard) {
                        window.Dashboard.render();
                        document.addEventListener('languagechange', function () {
                            if (window.Dashboard) window.Dashboard.render();
                        });
                    }
                }
            });
        } else {
            // If Auth not available, redirect to login
            window.location.href = 'login.html';
        }

        // User button click - logout
        document.getElementById('userBtn').addEventListener('click', async () => {
            const t = window.I18N ? window.I18N.t.bind(window.I18N) : (k => k);
            if (await Dialogs.confirm(t('index.logoutConfirm'))) {
                try {
                    await window.Auth.logout();
                    window.location.href = 'login.html';
                } catch (error) {
                    Dialogs.alert(t('index.logoutError') + error.message);
                }
            }
        });
    </script>
</body>
</html>
